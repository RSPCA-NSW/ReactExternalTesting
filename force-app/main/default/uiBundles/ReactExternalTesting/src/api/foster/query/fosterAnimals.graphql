query FosterAnimals($unitIds: [ID!]) {
  uiapi {
    query {
      animalos__Animal__c(
        where: {
          and: [
            { animalos__Current_Unit__c: { in: $unitIds } }
            { animalos__Stage__c: { ne: "Out" } }
          ]
        }
        orderBy: { animalos__Animal_Name__c: { order: ASC } }
        first: 200
      ) {
        edges {
          node {
            Id
            animalos__Animal_Name__c {
              value
            }
            animalos__Stage__c {
              value
            }
          }
        }
      }
    }
  }
}